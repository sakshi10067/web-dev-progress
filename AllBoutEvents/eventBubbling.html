<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubbling</title>
    <style>
        .container{
            border: 2px solid black;
            background-color: rgb(146, 146, 90);
            width:200px;
            height:200px;
        }
        .childContainer{
            /* border: 2px solid black; */
            background-color: green;
            width:150px;
            height:150px;
        
        }
        .child{
            border: 2px solid black;
            background-color: rgb(175, 138, 138);
        }
    </style>
</head>
<body>
    <div class="container">
        <section class="childContainer">
            <div class="child">
                i am a child
            </div>
        </section>
    </div>
</body>
<script>
    document.querySelector(".child").addEventListener("click", (e)=>{
        e.stopPropagation();
        alert("child clicked");
    })
    document.querySelector(".childContainer").addEventListener("click", (e)=>{
        alert("child container clicked");
    })
    document.querySelector(".container").addEventListener("click", (e)=>{
        alert("container clicked");
    })
    // setInterval(()=>{
    //     alert("hello");
    // }, 2000)

    setTimeout(()=>{
        alert("only once");
    }, 2000);


    </script>
</html>
